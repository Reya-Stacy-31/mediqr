<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MediQR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; }
        body {
            background-image: url("QR-Integrated-Medical-Data.png");
            background-repeat: no-repeat; background-position: center;
            background-size: 100% 100%; background-color: #062a4f;
            display: flex; justify-content: center; align-items: center;
        }
        .reset-box {
            width: 300px; text-align: center; background: white;
            padding: 30px 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .reset-box h2 { color: #062a4f; margin-bottom: 20px; font-size: 20px; font-weight: 700; }
        .reset-box input {
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1;
            border-radius: 6px; background: #f8fafc; font-size: 14px; outline: none;
        }
        .reset-box button {
            width: 100%; padding: 12px; margin-top: 10px; border: none;
            border-radius: 6px; background: #3b82f6; color: white;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 300px; }
        .modal-btn { 
            width: 100%; padding: 12px; background: #25d366; color: white; 
            border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="reset-box">
        <h2>Reset Password</h2>
        <input type="text" id="inputPin" placeholder="6-Digit PIN">
        <input type="password" id="newPass" placeholder="New Password">
        <input type="password" id="confirmPass" placeholder="Confirm Password">
        <button id="updateBtn" onclick="performReset()">Update Password</button>
    </div>

    <div class="modal-overlay" id="successPopup">
        <div class="modal-content">
            <h3 style="color: #062a4f;">Success!</h3>
            <p style="color: #64748b; margin-top: 5px;">Password has been successfully Reset</p>
            <button class="modal-btn" onclick="window.location.href='index.html'">OK</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnSxAvlAvjmG6ttVXIZU27yXHmLjcC5zw",
            authDomain: "mediqrcard.firebaseapp.com",
            projectId: "mediqrcard",
            appId: "1:440349102167:web:c55317c30e1d856c0fd312"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

    window.performReset = async function() {
    const enteredPin = document.getElementById("inputPin").value.trim();
    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    
    // CHANGED: Pull from localStorage
    const storedPin = localStorage.getItem("resetPin");
    const docId = localStorage.getItem("targetUserDocId");

    console.log("DEBUG: Stored PIN in LocalStorage:", storedPin);
    console.log("DEBUG: Entered PIN:", enteredPin);

    if (!storedPin) {
        alert("PIN not found. Please request a new PIN from the Forgot Password page.");
        return;
    }

    if (String(enteredPin) !== String(storedPin)) {
        alert("Invalid PIN. Please enter the correct code sent to your WhatsApp.");
        return;
    }

    // ... rest of your existing logic ...

    try {
        const userRef = doc(db, "logins", docId);
        await updateDoc(userRef, { passwd: newPass });

        // Clear storage after success
        localStorage.removeItem("resetPin");
        localStorage.removeItem("targetUserDocId");
        
        document.getElementById("successPopup").style.display = "flex";
    } catch (error) {
        alert("Update Failed: " + error.message);
    }
};
</script>
</body>
</html>
