<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediQR Emergency View</title>
<style>
    body{
        font-family:'Segoe UI',sans-serif;
        padding:20px;
        background:#f1f5f9;
        display:flex;
        justify-content:center;
    }
    .card{
        background:white;
        padding:25px;
        border-radius:15px;
        width:100%;
        max-width:420px;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }
    .emergency-header{
        background:#dc2626;
        color:white;
        padding:15px;
        border-radius:10px;
        text-align:center;
        margin-bottom:20px;
    }
    .blood{
        font-size:45px;
        font-weight:bold;
        cursor:pointer;
    }
    .label{
        color:#64748b;
        font-size:11px;
        font-weight:bold;
        text-transform:uppercase;
        margin-bottom:2px;
    }
    .value{
        font-size:18px;
        color:#1e293b;
        margin-bottom:15px;
        font-weight:600;
    }
    .allergy-badge{
        background:#fee2e2;
        color:#dc2626;
        padding:8px;
        border-radius:6px;
        border:1px solid #fecaca;
    }
    .contact-grid,.security-grid{
        display:flex;
        flex-direction:column;
        gap:10px;
        margin-bottom:20px;
    }
    .access-card{
        display:flex;
        align-items:center;
        gap:15px;
        background:#f8fafc;
        border:1px solid #e2e8f0;
        padding:15px;
        border-radius:10px;
        cursor:pointer;
        transition:all 0.2s;
    }
    .access-card:hover{
        border-color:#3b82f6;
        background:#eff6ff;
    }
    .icon-circle{
        width:40px;
        height:40px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:20px;
    }
    .rel-tag{
        font-size:11px;
        font-weight:800;
        text-transform:uppercase;
        color:#1e40af;
        background:#dbeafe;
        padding:2px 8px;
        border-radius:4px;
        margin-top:4px;
        display:inline-block;
    }
    .btn-unlock{
        background:#1e293b;
        color:white;
        font-weight:bold;
        justify-content:center;
        margin-top:10px;
        border:none;
        width: 100%;
    }
    .hidden-tier{
        display:none;
        background:#fff7ed;
        padding:15px;
        border-radius:10px;
        margin-top:15px;
        border:1px dashed #f97316;
    }
</style>
</head>
<body>

<div class="card" id="mainBody">
    Loading Patient Profile...
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-lite.js";

const firebaseConfig={
    apiKey:"YOUR_FIREBASE_API_KEY",
    authDomain:"mediqrcard.firebaseapp.com",
    projectId:"mediqrcard",
    appId:"YOUR_APP_ID"
};

const t_sid='ACf35b73f90a9d0e2edd55ff6c7082df6a';
const t_enc='ZDU5ZWEwYWVjMDI3OGRkMjY1MjQ1OTU4ZTlkYjdhYTA=';
const t_sender='whatsapp:+14155238886';

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const urlParams=new URLSearchParams(window.location.search);
const id=urlParams.get("id");

async function reverseGeocode(lat,lon){
    try{
        const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        const data=await res.json();
        return data.address.suburb || data.address.neighbourhood || data.address.city || "Unknown Area";
    }catch{
        return "Unknown Location";
    }
}

async function getLocation(){
    return new Promise((resolve)=>{
        navigator.geolocation.getCurrentPosition(async(pos)=>{
            const lat=pos.coords.latitude;
            const lon=pos.coords.longitude;
            const area=await reverseGeocode(lat,lon);
            resolve({lat, lon, area});
        },()=>{
            resolve({lat:"Unknown", lon:"Unknown", area:"Location Unavailable"});
        });
    });
}

window.sendTwilioAlert=async(toPhone,message)=>{
    const t_token=atob(t_enc);
    const authHeader=btoa(`${t_sid}:${t_token}`);
    const cleanPhone=toPhone.replace(/\D/g,'');

    await fetch(`https://api.twilio.com/2010-04-01/Accounts/${t_sid}/Messages.json`,{
        method:'POST',
        headers:{
            'Content-Type':'application/x-www-form-urlencoded',
            'Authorization':`Basic ${authHeader}`
        },
        body:new URLSearchParams({
            'To':`whatsapp:+${cleanPhone}`,
            'From':t_sender,
            'Body':message
        })
    });
};

window.showSecurityOptions=()=>{
    document.getElementById('unlockButtonArea').style.display="none";
    document.getElementById('securityGate').style.display="block";
};

if(id){
    const snap=await getDoc(doc(db,"patients",id));
    if(snap.exists()){
        const p=snap.data();
        
        // Clean numbers for dialer
        const dial1 = p.contact1_phone.replace(/\D/g,'');
        const dial2 = p.contact2_phone.replace(/\D/g,'');

        document.getElementById('mainBody').innerHTML=`
            <div class="emergency-header">
                <div class="label" style="color:white;opacity:0.9;">Blood Group</div>
                <div class="blood">${p.blood}</div>
            </div>

            <div class="label">Patient Name</div>
            <div class="value">${p.name}</div>

            <div class="label">Age</div>
            <div class="value">${p.age}</div>

            <div class="label" style="color:#dc2626">Allergies</div>
            <div class="value allergy-badge">${p.allergies||'None Reported'}</div>

            <div class="label">Emergency Contacts (Click to Call)</div>
            <div class="contact-grid">
                <a href="tel:+${dial1}" style="text-decoration:none; color:inherit;">
                    <div class="access-card">
                        <div class="icon-circle" style="background:#dbeafe;color:#2563eb">📞</div>
                        <div>
                            <div style="font-weight:bold">${p.contact1_name}</div>
                            <div style="font-size:13px; color:#2563eb;">+${p.contact1_phone}</div>
                            <div class="rel-tag">${p.contact1_rel}</div>
                        </div>
                    </div>
                </a>

                <a href="tel:+${dial2}" style="text-decoration:none; color:inherit;">
                    <div class="access-card">
                        <div class="icon-circle" style="background:#dbeafe;color:#2563eb">📞</div>
                        <div>
                            <div style="font-weight:bold">${p.contact2_name}</div>
                            <div style="font-size:13px; color:#2563eb;">+${p.contact2_phone}</div>
                            <div class="rel-tag">${p.contact2_rel}</div>
                        </div>
                    </div>
                </a>
            </div>

            <div id="unlockButtonArea">
                <button class="access-card btn-unlock" onclick="window.showSecurityOptions()">
                    🔒 UNLOCK MEDICAL HISTORY
                </button>
            </div>

            <div id="securityGate" style="display:none">
                <div class="label">Choose Access Method</div>
                <div class="security-grid">
                    <div class="access-card" onclick="window.handlePinAccess('${p.pin}')">
                        <div class="icon-circle" style="background:#fef3c7;color:#d97706">🔑</div>
                        <div>
                            <div style="font-weight:bold">Family / Guardian Access</div>
                            <div style="font-size:12px;color:#64748b">Enter 6 Digit PIN</div>
                        </div>
                    </div>
                    <div class="access-card" id="medicBtn">
                        <div class="icon-circle" style="background:#dcfce7;color:#16a34a">🏥</div>
                        <div>
                            <div style="font-weight:bold">Medical Practitioner</div>
                            <div style="font-size:12px;color:#64748b">Emergency Access</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="secretArea" class="hidden-tier">
                <h3 style="color:#c2410c;font-size:13px;margin-bottom:10px;border-bottom:1px solid #fed7aa;padding-bottom:5px">
                    PROTECTED MEDICAL DATA
                </h3>
                <div class="label">Aadhaar Number</div>
                <div class="value">${p.aadhar}</div>
                <div class="label">Medical Conditions</div>
                <div class="value">${p.conditions||'None'}</div>
                <div class="label">Current Medication</div>
                <div class="value">${p.medication||'None'}</div>
            </div>
        `;

        // Logic for Practitioner Access
        document.getElementById('medicBtn').onclick=async()=>{
            const doctorName=prompt("Enter Doctor Name");
            if(!doctorName)return;
            const doctorId=prompt("Enter Medical Practitioner Number (max 15 characters)");
            if(!doctorId||doctorId.length>15){
                alert("Invalid Practitioner ID");
                return;
            }
            const hospital=prompt("Enter Hospital Name");
            if(!hospital)return;

            alert("Capturing hospital location...");
            const loc=await getLocation();

            const message=`Emergency Alert: ${p.name} has been admitted to ${hospital} (${loc.area}). 
Dr. ${doctorName} is requesting access. 
Location: Lat ${loc.lat}, Lon ${loc.lon}. 
Verification PIN: ${p.pin}`;

            alert("Alerting family contacts via WhatsApp...");
            await window.sendTwilioAlert(p.contact1_phone, message);
            await window.sendTwilioAlert(p.contact2_phone, message);

            const enteredPin=prompt("Family alerted. Enter 6 Digit PIN to unlock:");
            if(enteredPin===p.pin){
                document.getElementById('secretArea').style.display="block";
                document.getElementById('securityGate').style.display="none";
            } else {
                alert("Invalid PIN");
            }
        };

        window.handlePinAccess=(correctPin)=>{
            const upin=prompt("Enter 6 Digit PIN");
            if(upin===correctPin){
                document.getElementById('secretArea').style.display="block";
                document.getElementById('securityGate').style.display="none";
            } else {
                alert("Incorrect PIN");
            }
        };
    } else {
        document.getElementById('mainBody').innerHTML = "Patient profile not found.";
    }
}
</script>
</body>
</html>
