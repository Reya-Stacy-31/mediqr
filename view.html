<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQR Emergency View</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f1f5f9; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .emergency-header { background: #dc2626; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .blood { font-size: 45px; font-weight: bold; }
        
        .label { color: #64748b; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
        .value { font-size: 18px; color: #1e293b; margin-bottom: 15px; font-weight: 600; }
        
        /* Contact Card Styles */
        .contact-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .contact-card { 
            display: flex; align-items: center; justify-content: space-between;
            background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; 
            border-radius: 10px; text-decoration: none; color: #1e40af;
            transition: background 0.2s;
        }
        .contact-card:hover { background: #dbeafe; }
        .contact-info { display: flex; flex-direction: column; }
        .contact-name { font-weight: bold; font-size: 16px; }
        .phone-icon { font-size: 20px; background: #2563eb; color: white; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 50%; }

        /* Security Section */
        .hidden-tier { display: none; background: #fff7ed; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px dashed #f97316; }
        .btn-unlock { width: 100%; padding: 15px; background: #1e293b; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card" id="mainBody">Loading Profile...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-lite.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "mediqrcard.firebaseapp.com",
        projectId: "mediqrcard",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id");

    if (id) {
        try {
            const snap = await getDoc(doc(db, "patients", id));
            if (snap.exists()) {
                const p = snap.data();
                document.getElementById('mainBody').innerHTML = `
                    <div class="emergency-header">
                        <div class="label" style="color:white; opacity: 0.9;">Blood Group</div>
                        <div class="blood">${p.blood}</div>
                    </div>
                    
                    <div class="label">Patient Name</div><div class="value">${p.name}</div>
                    <div class="label">Age</div><div class="value">${p.age}</div>

                    <div class="label">Emergency Contacts</div>
                    <div class="contact-grid">
                        <a href="tel:${p.contact1_phone}" class="contact-card">
                            <div class="contact-info">
                                <span class="contact-name">${p.contact1_name}</span>
                                <span style="font-size:12px;">Primary Contact</span>
                            </div>
                            <div class="phone-icon">📞</div>
                        </a>
                        <a href="tel:${p.contact2_phone}" class="contact-card" style="background: #ecfdf5; border-color: #a7f3d0; color: #065f46;">
                            <div class="contact-info">
                                <span class="contact-name">${p.contact2_name}</span>
                                <span style="font-size:12px;">Secondary Contact</span>
                            </div>
                            <div class="phone-icon" style="background: #059669;">📞</div>
                        </a>
                    </div>
                    
                    <button class="btn-unlock" id="unlockBtn">🔓 UNLOCK MEDICAL HISTORY</button>
                    
                    <div id="secretArea" class="hidden-tier">
                        <h3 style="color:#c2410c; font-size: 13px; margin-bottom: 10px; border-bottom: 1px solid #fed7aa; padding-bottom: 5px;">PROTECTED MEDICAL DATA</h3>
                        
                        <div class="label">Aadhaar Number</div>
                        <div class="value" style="font-family: monospace;">${p.aadhar}</div>
                        
                        <div class="label">Medical Conditions</div>
                        <div class="value">${p.conditions || 'None Reported'}</div>
                        
                        <div class="label">Current Medication</div>
                        <div class="value">${p.medication || 'None Reported'}</div>
                        
                        <div class="label">Allergies</div>
                        <div class="value" style="color: #dc2626;">${p.allergies || 'None'}</div>
                    </div>
                `;

                document.getElementById('unlockBtn').onclick = () => {
                    const pin = prompt("Medical Authorization Required:\nEnter the 6-Digit Patient PIN:");
                    if (pin === p.pin) {
                        document.getElementById('secretArea').style.display = "block";
                        document.getElementById('unlockBtn').style.display = "none";
                    } else if (pin !== null) {
                        alert("Unauthorized: Incorrect PIN");
                    }
                };
            } else {
                document.getElementById('mainBody').innerHTML = "Record not found.";
            }
        } catch (e) { 
            console.error(e);
            document.getElementById('mainBody').innerHTML = "Connection Error."; 
        }
    } else {
        document.getElementById('mainBody').innerHTML = "Invalid URL (No ID provided).";
    }
</script>
</body>
</html>
