<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQR Emergency Viewer</title>
    <style>
        :root { --emergency-red: #dc2626; --primary-blue: #1e40af; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Header */
        .header { background: var(--emergency-red); color: white; text-align: center; padding: 20px; }
        .header h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }

        /* Public Data Section */
        .section { padding: 20px; border-bottom: 1px solid #e2e8f0; }
        .label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 18px; color: #1e293b; margin-top: 4px; font-weight: 600; }
        .blood-group { font-size: 32px; color: var(--emergency-red); font-weight: 800; }

        /* Tier 2: Hidden Section */
        #privateTier { display: none; background: #fff7ed; padding: 20px; border-top: 4px solid #f97316; }
        
        /* Buttons */
        .btn { display: block; width: 100%; padding: 15px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; margin-top: 10px; cursor: pointer; border: none; }
        .btn-call { background: #2563eb; color: white; }
        .btn-unlock { background: #1e293b; color: white; margin-top: 20px; }

        #loading { text-align: center; padding: 50px; color: #64748b; }
    </style>
</head>
<body>

<div class="container" id="mainContent">
    <div id="loading">Searching Cloud Records...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-lite.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "mediqrcard.firebaseapp.com",
        projectId: "mediqrcard",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchData() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
            document.getElementById("mainContent").innerHTML = "<p style='padding:20px;'>Error: No Patient ID provided.</p>";
            return;
        }

        try {
            const docRef = doc(db, "patients", id);
            const snap = await getDoc(docRef);

            if (snap.exists()) {
                const data = snap.data();
                renderPage(data);
            } else {
                document.getElementById("mainContent").innerHTML = "<p style='padding:20px;'>Record not found in Cloud.</p>";
            }
        } catch (e) {
            console.error(e);
            document.getElementById("mainContent").innerHTML = "<p style='padding:20px;'>Connection Error.</p>";
        }
    }

    function renderPage(data) {
        document.getElementById("mainContent").innerHTML = `
            <div class="header"><h1>Emergency Profile</h1></div>
            
            <div class="section" style="text-align:center;">
                <div class="label">Blood Group</div>
                <div class="blood-group">${data.blood || 'Unknown'}</div>
            </div>

            <div class="section">
                <div class="label">Full Name</div>
                <div class="value">${data.name}</div>
                <div style="margin-top:10px;">
                    <div class="label">Age</div>
                    <div class="value">${data.age}</div>
                </div>
            </div>

            <div class="section">
                <div class="label">Emergency Contacts</div>
                <a href="tel:${data.contact1}" class="btn btn-call">📞 Call Primary Contact</a>
                ${data.contact2 ? `<a href="tel:${data.contact2}" class="btn btn-call" style="background:#059669">📞 Call Secondary Contact</a>` : ''}
            </div>

            <div class="section" id="unlockSection">
                <button class="btn btn-unlock" onclick="window.unlockPrivateTier()">🔓 View Medical History (Tier 2)</button>
                <p style="font-size:10px; color:gray; margin-top:10px; text-align:center;">Requires Patient's Personal PIN</p>
            </div>

            <div id="privateTier">
                <div class="label">Allergies</div>
                <div class="value">${data.allergies || 'None reported'}</div>
                <div style="margin-top:15px;">
                    <div class="label">Conditions</div>
                    <div class="value">${data.conditions || 'None reported'}</div>
                </div>
                <div style="margin-top:15px;">
                    <div class="label">Medication</div>
                    <div class="value">${data.medication || 'None reported'}</div>
                </div>
            </div>
        `;

        // Attach the unlock function to window so the button can find it
        window.unlockPrivateTier = function() {
            // For now, we use a simple prompt. 
            // In a real app, you'd check this PIN against the Firestore value.
            const pin = prompt("Enter 4-Digit Patient PIN:");
            if (pin === "1234") { // Temporary test PIN
                document.getElementById("privateTier").style.display = "block";
                document.getElementById("unlockSection").style.display = "none";
            } else {
                alert("Incorrect PIN. Access Denied.");
            }
        };
    }

    fetchData();
</script>
</body>
</html>
