<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQR Emergency Record</title>
    <style>
        :root { --emergency-red: #dc2626; --primary-blue: #1e40af; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f8fafc; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Tier 1 Header: Publicly Visible */
        .header { background: var(--emergency-red); color: white; padding: 25px; text-align: center; }
        .blood-tag { font-size: 48px; font-weight: 800; display: block; margin-top: 10px; }
        
        .info-card { padding: 20px; }
        .data-row { margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 18px; color: #1e293b; font-weight: 600; margin-top: 2px; }

        /* Tier 2: Secret Section */
        #secretTier { display: none; background: #fff7ed; padding: 20px; border-top: 2px dashed #f97316; }
        
        .btn { display: block; width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; text-align: center; font-size: 16px; transition: 0.2s; }
        .btn-call { background: var(--primary-blue); color: white; margin-bottom: 10px; }
        .btn-lock { background: #1e293b; color: white; margin-top: 20px; }
        
        #loader { text-align: center; padding: 50px; font-weight: 600; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container" id="viewContainer">
    <div id="loader">Fetching Cloud Record...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-lite.js";

    // Use your project details from image_2a1eb8.png
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", // Replace with your actual Web API Key
        authDomain: "mediqrcard.firebaseapp.com",
        projectId: "mediqrcard",
        appId: "YOUR_APP_ID"    // Replace with your actual App ID
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadPatientRecord() {
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');

        if (!patientId) {
            document.getElementById('viewContainer').innerHTML = "<div style='padding:40px;'>No Patient ID found in QR code.</div>";
            return;
        }

        try {
            const docRef = doc(db, "patients", patientId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                displayData(docSnap.data());
            } else {
                document.getElementById('viewContainer').innerHTML = "<div style='padding:40px;'>Record not found.</div>";
            }
        } catch (error) {
            console.error(error);
            document.getElementById('viewContainer').innerHTML = "<div style='padding:40px;'>Error connecting to Firestore.</div>";
        }
    }

    function displayData(data) {
        document.getElementById('viewContainer').innerHTML = `
            <div class="header">
                <span class="label" style="color:rgba(255,255,255,0.8)">Emergency Blood Group</span>
                <span class="blood-tag">${data.blood}</span>
            </div>

            <div class="info-card">
                <div class="data-row">
                    <div class="label">Patient Name</div>
                    <div class="value">${data.name}</div>
                </div>
                <div class="data-row">
                    <div class="label">Age</div>
                    <div class="value">${data.age} Years</div>
                </div>
                
                <div class="label" style="margin-top:20px;">Emergency Actions</div>
                <a href="tel:${data.contact1}" class="btn btn-call">📞 Call Primary Contact</a>
                ${data.contact2 ? `<a href="tel:${data.contact2}" class="btn btn-call" style="background:#059669">📞 Call Secondary Contact</a>` : ''}

                <button class="btn btn-lock" onclick="window.unlockTier2()">🔓 View Medical History (Tier 2)</button>
            </div>

            <div id="secretTier">
                <h3 style="color:#c2410c; margin-bottom:15px; font-size:14px;">CONFIDENTIAL MEDICAL DATA</h3>
                <div class="data-row">
                    <div class="label">Aadhaar Number</div>
                    <div class="value">${data.aadhar}</div>
                </div>
                <div class="data-row">
                    <div class="label">Known Allergies</div>
                    <div class="value">${data.allergies}</div>
                </div>
                <div class="data-row">
                    <div class="label">Medical Conditions</div>
                    <div class="value">${data.conditions}</div>
                </div>
                <div class="data-row">
                    <div class="label">Current Medication</div>
                    <div class="value">${data.medication}</div>
                </div>
            </div>
        `;

        window.unlockTier2 = function() {
            // For testing, we use a simple prompt. 
            // Real implementation would compare against data.pin
            const pin = prompt("Enter Patient PIN to unlock sensitive data:");
            if (pin === "1234") { 
                document.getElementById('secretTier').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                alert("Incorrect PIN. Access Denied.");
            }
        };
    }

    loadPatientRecord();
</script>
</body>
</html>
